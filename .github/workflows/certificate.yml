name: cortex-certificate

# BLP-003 T-1.5 — Nivel A en CI: certificado determinista, sin LLM.
# Art. XVII Constitucion: ningun claim sin evidencia reproducible.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install codec-cortex (editable)
        run: python -m pip install -e .

      - name: Probes del nucleo (P01-P29)
        run: python scripts/ccx_probes.py

      - name: Conformance slots 0.2
        run: python -m codec_cortex conformance

      - name: Build Rust runtime (paridad D3)
        run: cargo build --release --manifest-path codec-cortex-rs/Cargo.toml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build Go runtime (paridad D3)
        run: go build -C codec-cortex-go -o bin/codec-cortex-linux-amd64 ./cmd/codec-cortex

      - name: Verificar sello del corpus
        run: sha256sum -c --quiet tests/SHA256SUMS

      - name: Certificado Nivel A (D1-D5)
        run: python -m bench.certify | tee certificate.txt

      - name: Publicar certificate.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate
          path: |
            bench/results/certificate.json
            bench/results/determinism.json
            certificate.txt