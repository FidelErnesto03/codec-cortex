blueprint: BLP-009
cycle: CYCLE-03
status: draft
sealed_at: null
freeze_blocked_on:
  - d1-d4 confirmados por el Arquitecto
  - aprobacion explicita para ejecutar celdas/gastar
  - declaracion de corpus y par de modelos

# --- Decisiones del Arquitecto (2026-11-14) -----------------------------------
decisions:
  d1_q8_framing: "a — descriptiva"
  d2_second_model: "a — modelo unico (aislar efecto formato/dialecto con potencia)"
  d3_spend: "a — sin gasto (free-tier / tope 0); consumo de celdas DETENIDO"
  d4_carryover: "a — carryover mecanico declarado y estratificado"

# --- Diseno simetrico --------------------------------------------------------
design:
  baseline: "1.0 valido (dialecto 1.0) — corrige confound g01 (run-001 usaba 0.1)"
  prompts: "simetricos entre brazos; contrato de tokens +-10%"
  confound_g02: "corregir asimetria de prompt que confunde h5 en run-001"
  strata:
    - dialecto: ["1.0"]
    - formato: [cortex, json, yaml, markdown, plaintext, xml]
  repetitions_min: 5          # R
  n_min: 20                   # potencia minima por celda
  semantic_recall: true       # evaluacion de recall semantico (ausente en run-001)
  counting: "planned == completed + failed (toda celda contada)"
  models_2026:
    - "<pendiente de declarar>"
  tokenizer: "tiktoken/o200k_base"
  multiplicity: holm-bonferroni
  corpus: "<pendiente de declarar; sello SHA256>"

# --- Hipotesis y falsacion (re-testeo bajo simetria) -------------------------
hypotheses:
  H3: "CORTEX es determinista (varianza de hash = 0)"
  H4: "CORTEX+modelo satisface tareas content-addressed que LLM-solo no"
  H5: "CORTEX >= formatos alternativos en comprension (re-test simetrico; run-001 fue confounded)"
  H6: "CORTEX reduce tokens/costo (sin tuning post-hoc; run-001 dio 0.727)"

falsation:
  H5: "no supera a Markdown/alternativas bajo condiciones simetricas"
  H6: "sin ahorro de tokens/costo"

# --- Presupuesto -------------------------------------------------------------
budget:
  max_usd: 0.0                # d3=a: sin gasto en esta fase
  on_reach: "DETENER (§16)"

# --- Claims y sellado --------------------------------------------------------
claim_format: "metrica, IC, n, modelo, corpus, prompt, dialecto, ruta, sha256"
sealing:
  immutable: true
  artifacts:
    - "prereg congelado (sha256)"
    - "prompts (sha256)"
    - "resultados por celda + celdas completadas/fallidas"
